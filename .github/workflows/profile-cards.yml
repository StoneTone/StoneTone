name: Update profile cards

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=StoneTone&show_icons=true&bg_color=0b0d2b&title_color=7dd3fc&icon_color=a78bfa&text_color=e2e8f0&border_color=1b2a6b&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=StoneTone&layout=compact&bg_color=0b0d2b&title_color=7dd3fc&text_color=e2e8f0&border_color=1b2a6b&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate space shooter game
        uses: czl9707/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/space-shooter.gif
          strategy: random

      - name: Commit updated cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile cards" || exit 0
          git push
